# Staging-only Streamlit deployment. Does not change the production FastAPI service.
services:
  - type: web
    name: trendforge-webapp-staging
    runtime: python
    plan: free
    branch: feature/r71-weekend-streamlit-research
    autoDeploy: false
    buildCommand: python -m pip install -r webapp/requirements.txt
    startCommand: python -m streamlit run webapp/app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: TRENDFORGE_API_URL
        value: https://trendforge-core.onrender.com
      - key: TRENDFORGE_WEBAPP_ACCESS_KEY
        sync: false
