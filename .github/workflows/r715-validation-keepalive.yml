name: R71.5 Validation Keepalive

on:
  push:
    branches:
      - ops/r715-validation-keepalive

permissions:
  contents: read

jobs:
  keepalive-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Keep TrendForge Core awake and collect validation export
        shell: bash
        run: |
          set -u
          rm -f trendforge_r715_validation.json
          for i in $(seq 1 13); do
            echo "cycle $i/13 $(date -u +%FT%TZ)"
            curl -fsS --retry 5 --retry-delay 5 --max-time 30               https://trendforge-core.onrender.com/health >/dev/null

            code=$(curl -sS --max-time 90               -o trendforge_r715_validation.json               -w "%{http_code}"               "https://trendforge-core.onrender.com/technical/validation/export?token=tf-r715-20261020-9c62a4b781" || true)

            if [ "$code" = "200" ] && [ -s trendforge_r715_validation.json ]; then
              echo "R71.5 export collected"
              break
            fi

            rm -f trendforge_r715_validation.json
            echo "Export not ready (HTTP $code)"
            if [ "$i" -lt 13 ]; then
              sleep 240
            fi
          done

          test -s trendforge_r715_validation.json

      - name: Upload R71.5 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-r715-validation
          path: trendforge_r715_validation.json
          if-no-files-found: error
          retention-days: 1
