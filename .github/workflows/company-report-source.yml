name: Public company report source observation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-company-observation:
    if: github.head_ref == 'codex/visual-stock-reports'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-production.lock
      - name: Observe a public example without owner data or credentials
        run: python -m scripts.check_company_report_source
