name: Render Connection Check

on:
  workflow_dispatch:
  push:
    branches: ["fix/render-connection-check"]
    paths: [".github/workflows/render-health.yml"]

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public API, webapp and current main release
        run: >-
          python -m scripts.verify_render_deployment
          --sha "$(git rev-parse HEAD)"
          --timeout 180
