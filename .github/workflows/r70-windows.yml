name: R70 Windows Local Runtime
on:
  push:
    branches:
      - feature/r70-2-windows-engine-runtime
      - feature/r70-3-hybrid-sync-foundation
  pull_request:
    paths:
      - "scripts/local_engine_runtime.py"
      - "services/hybrid_sync_service.py"
      - "api/hybrid_sync_router.py"
      - "api/app.py"
      - "scripts/hybrid_sync_cli.py"
      - "tests/test_r70_hybrid_sync.py"
      - "scripts/windows/**"
      - "tests/test_r70_local_engine_runtime.py tests/test_r70_hybrid_sync.py"
      - "core/database.py"
      - "database/migrations/**"
      - ".github/workflows/r70-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest pandas fastapi httpx
      - name: Run R70 storage and runtime regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_r70_local_storage.py tests/test_r70_local_engine_runtime.py
      - name: Parse Windows setup scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($_.Name): $($errors | Out-String)"
            }
          }
