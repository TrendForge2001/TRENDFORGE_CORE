name: TrendForge Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run typecheck
      - run: node --test scripts/test_workbench_levels.cjs

  render-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workbench-levels, finedge-provider-quality, test, production-dependency-audit, dependency-vulnerabilities, secret-scan, pc-paper-runtime, research-runtime-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Render serves this release and its webapp
        run: python -m scripts.verify_render_deployment --sha "$GITHUB_SHA" --timeout 600
      - name: Install isolated mobile URL browser tools
        run: |
          python -m venv "$RUNNER_TEMP/public-mobile-env"
          "$RUNNER_TEMP/public-mobile-env/bin/python" -m pip install -r requirements-browser.txt
          "$RUNNER_TEMP/public-mobile-env/bin/python" -m playwright install --with-deps chromium
      - name: Verify deployed public mobile paper URL and owner sign-in
        run: |
          "$RUNNER_TEMP/public-mobile-env/bin/python" -m scripts.verify_public_mobile --output-dir public-mobile-evidence
      - name: Upload deployed mobile URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mobile-evidence
          path: public-mobile-evidence/
          if-no-files-found: warn

  finedge-provider-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider analysis tools
