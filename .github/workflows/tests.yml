name: TrendForge Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [finedge-provider-quality, test, production-dependency-audit, dependency-vulnerabilities, secret-scan, pc-paper-runtime, research-runtime-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Render serves this release and its webapp
        run: python -m scripts.verify_render_deployment --sha "$GITHUB_SHA" --timeout 600
      - name: Install isolated mobile URL browser tools
        run: |
          python -m venv "$RUNNER_TEMP/public-mobile-env"
          "$RUNNER_TEMP/public-mobile-env/bin/python" -m pip install -r requirements-browser.txt
          "$RUNNER_TEMP/public-mobile-env/bin/python" -m playwright install --with-deps chromium
      - name: Verify deployed public mobile paper URL and owner sign-in
        run: |
          "$RUNNER_TEMP/public-mobile-env/bin/python" -m scripts.verify_public_mobile --output-dir public-mobile-evidence
      - name: Upload deployed mobile URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mobile-evidence
          path: public-mobile-evidence/
          if-no-files-found: warn

  finedge-provider-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider analysis tools
        run: |
          python -m pip install requests==2.34.2 ruff==0.17.1
          npm install --prefix "$RUNNER_TEMP/finedge-quality" --no-audit --no-fund pyright@1.1.414
      - name: Lint and format scoped release code
        run: |
          quality_paths=(
            scripts/verify_public_mobile.py
            services/cloud_workload_gate.py services/kite_market_preflight.py
            services/render_paper_boot.py services/research_partitions.py
            tests/test_render_market_preparation.py
            webapp/scanner_reference.py tests/test_research_periods_and_references.py
            services/research_storage_boot.py tests/test_research_storage_boot.py
            providers/candle_repair.py tests/test_candle_repair.py
            tests/test_validation_evaluator_parity.py
            core/pc_paper_policy.py scripts/build_pc_paper_package.py
            scripts/verify_paper_browser.py tests/support/paper_browser_app.py
            tests/test_pc_paper_account_policy.py tests/test_pc_paper_package.py
            webapp/paper_workspace.py
            backtest/indicator_rows.py services/research_archive.py services/research_capacity.py
            scripts/save_research_reports.py tests/test_research_runtime_recovery.py
            scripts/verify_research_browser.py tests/support/research_browser_app.py
            api/research_reports_router.py database/migrations/research_batches.py
            database/repositories/research_batches.py scanner/strategy_horizons.py
            services/execution_report.py services/research_report.py services/research_batches.py
            services/research_execution.py services/research_worker.py services/research_storage.py
            services/research_recovery.py tests/test_research_process_isolation.py
            tests/support/research_candles.py tests/support/research_worker.py
            webapp/horizon_controls.py webapp/research_workspace.py webapp/report_workspace.py
            webapp/core_status.py webapp/pages/reports.py
            tests/test_research_batches.py tests/test_research_report_workspace.py
            webapp/backtest_controls.py webapp/backtest_trade_report.py
            tests/test_compact_backtesting.py
            core/kite_environment.py core/deployment_role.py services/kite_session_probe.py
            tests/test_kite_environment.py tests/test_kite_startup_probe_and_cloud_role.py
            tests/test_adx_directional_movement.py tests/test_adx_validation_admission.py
            config/scanner_capacity.py services/candle_batches.py tests/test_large_scanner_capacity.py
            services/staged_paper_execution.py services/staged_paper_plan.py
            backtest/history_alignment.py tests/test_history_alignment.py
            tests/test_staged_paper_execution.py
            scanner/ema_pivot_setups.py scanner/ema_pivot_scanner.py
            indicators/ema_pivot.py backtest/ema_pivot_engine.py
            webapp/ema_pivot_controls.py tests/test_ema_pivot_scanners.py
            tests/test_ema_pivot_backtests.py tests/test_ema_pivot_workspace.py
            webapp/workspace_layout.py tests/test_intraday_shorts.py
            webapp/market_colours.py tests/test_short_setups_execution.py
            scanner/portfolio_policy.py backtest/portfolio_engine.py
            services/portfolio_backtest_service.py api/portfolio_backtest_router.py
            webapp/candidate_analysis.py webapp/portfolio_backtesting.py
            tests/test_three_stock_portfolio.py
            services/cloud_paper_storage.py scripts/render_paper_runtime.py
            services/mobile_identity.py api/mobile_auth_router.py
            tests/test_cloud_paper_storage.py tests/test_mobile_identity.py
            webapp/paper_handoff.py services/kite_trading_readiness.py
            tests/test_paper_controls_and_kite_preparation.py
            scanner/workspace_strategies.py webapp/strategy_catalog.py tests/test_source_six_catalog.py
            webapp/trade_timestamps.py webapp/backtest_pnl.py tests/test_backtest_pnl_dashboard.py
            config/nifty_universes.py webapp/nifty_selection.py
            tests/test_nifty_workspace_selection.py
            webapp/scanner_backtesting.py tests/test_scanner_stock_backtests.py
            providers/kite_diagnostics.py core/pc_kite_credentials.py
            scripts/check_kite_session.py tests/test_kite_session_diagnostics.py
            scripts/check_paper_runtime.py tests/test_paper_runtime_diagnostics.py
            services/paper_storage_setup.py scripts/check_paper_storage.py
            scripts/pc_paper_runtime.py tests/test_pc_paper_runtime.py
            tests/test_paper_storage_setup.py
            providers/kite_paper_quotes.py services/strategy_paper_automation.py
            services/strategy_paper_reporting.py api/paper_automation_router.py
            webapp/paper_automation.py tests/test_saved_strategy_automation.py
            providers/finedge_api_provider.py core/broker_execution_policy.py
            providers/kite_rest_client.py providers/kite_errors.py providers/kite_ticker.py
            scripts/check_dependency_audit.py scripts/check_secrets.py scripts/verify_render_deployment.py
            tests/test_dependency_audit_gate.py tests/test_secret_scan_gate.py
            tests/test_testclient_compatibility.py tests/test_ci_security_contract.py
            tests/test_kite_rest_client.py tests/test_kite_ticker.py tests/test_kite_sdk_dependency_boundary.py
            webapp/api_client.py webapp/paper_excel.py services/technical_trading_service.py
            tests/test_r726_api_error_privacy.py tests/test_r726_frontend_transport.py
            tests/test_r726_workspace_broker_integrity.py tests/test_r726_ui_runtime_regressions.py
            tests/test_r726_spreadsheet_safety.py tests/test_paper_finite_prices.py
            tests/test_paper_restore_admission.py tests/test_technical_trading_safety_r726.py
          )
          python -m ruff check --select E,F,I,B,UP,SIM "${quality_paths[@]}"
          python -m ruff format --check "${quality_paths[@]}"
          python -m ruff check --select F \
            api/app.py api/trading_workspace_router.py core/application_factory.py \
            providers/kite_provider.py config/settings.py \
            services/multi_strategy_nifty_scanner.py services/paper_auto_entry_service.py \
            services/strategy_driven_paper_service.py services/strategy_paper_monitor_service.py \
            services/paper_quote_monitor.py services/paper_trading_runtime.py \
            services/paper_trading_service.py services/trading_workspace_service.py \
            webapp/pages/kite_backtesting.py webapp/pages/paper_session.py \
            webapp/pages/technical_scanner.py webapp/pages/watchlists.py webapp/ui.py
      - name: Strict type check provider and release boundaries
        run: |
          "$RUNNER_TEMP/finedge-quality/node_modules/.bin/pyright" --project pyright-finedge.json
          "$RUNNER_TEMP/finedge-quality/node_modules/.bin/pyright" --project pyright-release.json

  dependency-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned security tools
        run: python -m pip install -r requirements-security.txt
      - name: Audit the exact production graph and require complete coverage
        run: python -m scripts.check_dependency_audit --requirements requirements-production.lock --output-dir security-reports
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-vulnerability-report
          path: security-reports/dependency-audit.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned security tools
        run: python -m pip install -r requirements-security.txt
      - name: Scan tracked files and reachable Git history without token verification
        run: python -m scripts.check_secrets --output-dir security-reports
      - name: Upload redacted secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: security-reports/secret-scan.json
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r webapp/requirements.txt -r requirements-test.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile source
        env:
          PYTHONPATH: .
        run: python -m compileall -q api core database engines providers scanner services start.py

      - name: Import production app
        env:
          PYTHONPATH: .
        run: python -c "from start import app; print(app.title)"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore


  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up production Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.lock

      - name: Verify production dependency consistency
        run: python -m pip check

      - name: Verify installed graph matches production lock
        run: |
          python - <<'PY'
          from importlib import metadata
          from pathlib import Path
          import re

          lock = Path("requirements-production.lock")
          expected = {}
          for raw in lock.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.fullmatch(r"([^=<>!~\s]+)==([^\s]+)", line)
              if not match:
                  raise SystemExit(f"Non-exact production lock entry: {line}")
              expected[match.group(1)] = match.group(2)

          missing = []
          mismatched = []
          for name, version in expected.items():
              try:
                  installed = metadata.version(name)
              except metadata.PackageNotFoundError:
                  missing.append(name)
                  continue
              if installed != version:
                  mismatched.append(
                      f"{name}: expected {version}, installed {installed}"
                  )

          if missing or mismatched:
              raise SystemExit(
                  "Production lock mismatch\n"
                  + "\n".join(
                      [f"missing: {name}" for name in missing] + mismatched
                  )
              )

          print(f"LOCKED_PACKAGES={len(expected)}")
          print("PRODUCTION_LOCK_MATCH=true")
          PY

      - name: Verify unified Render ASGI import
        env:
          TRENDFORGE_UNIFIED_UI_ENABLED: "true"
          PORT: "10000"
        run: |
          python - <<'PY'
          import start
          from starlette.applications import Starlette

          if not isinstance(start.app, Starlette):
              raise SystemExit("Unified runtime did not create a Starlette application")

          paths = [getattr(route, "path", None) for route in start.app.routes]
          if "/app" not in paths or "/" not in paths:
              raise SystemExit(f"Unified runtime routes missing: {paths}")

          print("UNIFIED_RENDER_IMPORT=true")
          print(f"UNIFIED_ROUTES={paths}")
          PY

      - name: Capture production graph before adding test tools
        run: |
          python -m pip freeze --all | sort | tee production-freeze.txt
          python - <<'PY'
          import platform
          print("PYTHON_RUNTIME=" + platform.python_version())
          PY

      - name: Upload production dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: production-freeze-py312
          path: production-freeze.txt
          if-no-files-found: error

      - name: Run regression suite against locked production dependencies
        run: |
          python -m pip install -c requirements-production.lock -r requirements-test.txt
          python -m pip check
          python -m pytest -q --junitxml=pytest-production-results.xml

      - name: Upload locked production test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-production-py312
          path: pytest-production-results.xml
          if-no-files-found: ignore

  research-runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact runtime and isolated browser tools
        run: |
          python -m pip install -r requirements-production.lock
          python -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/python" -m pip install -r requirements-browser.txt
          "$RUNNER_TEMP/browser-env/bin/python" -m playwright install --with-deps chromium
      - name: Build isolated research runtime for Render resource limits
        run: docker build --build-arg TEST_UID="$(id -u)" -f tests/support/research_runtime.Dockerfile -t trendforge-research-test .
      - name: Verify UI, daily and intraday backtests at 0.15 CPU and 512 MiB
        run: |
          "$RUNNER_TEMP/browser-env/bin/python" -m scripts.verify_research_browser --runtime-python "$(command -v python)" --container-image trendforge-research-test --output-dir browser-evidence
      - name: Verify PC paper refresh, form preservation and emergency controls
        run: |
          "$RUNNER_TEMP/browser-env/bin/python" -m scripts.verify_paper_browser --runtime-python "$(command -v python)" --output-dir paper-browser-evidence
      - name: Upload paper browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-browser-evidence
          path: paper-browser-evidence/
          if-no-files-found: warn
      - name: Verify Render mobile paper controls and single-executor confirmation
        run: |
          "$RUNNER_TEMP/browser-env/bin/python" -m scripts.verify_paper_browser --mobile --runtime-python "$(command -v python)" --output-dir mobile-paper-browser-evidence
      - name: Upload mobile paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-paper-browser-evidence
          path: mobile-paper-browser-evidence/
          if-no-files-found: warn
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-browser-evidence
          path: browser-evidence/
          if-no-files-found: error

  pc-paper-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pc.lock
      - name: Install the locked Windows paper runtime
        run: python -m pip install -r requirements-pc.lock -r requirements-test.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Parse the Windows launcher
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/windows/Start-TrendForgePaper.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Windows paper launcher syntax is invalid' }
          foreach ($backupScript in @('Save-TrendForgeReports.ps1', 'Save-CloudReports.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "scripts/windows/$backupScript"),
              [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Report backup syntax is invalid: $backupScript" }
          }
      - name: Verify real Windows storage recovery and paper safeguards
        run: python -m pytest -q tests/test_pc_paper_runtime.py tests/test_pc_paper_account_policy.py tests/test_pc_paper_package.py tests/test_kite_session_diagnostics.py tests/test_paper_runtime_diagnostics.py tests/test_short_setups_execution.py tests/test_ema_pivot_scanners.py tests/test_ema_pivot_backtests.py tests/test_staged_paper_execution.py tests/test_history_alignment.py tests/test_large_scanner_capacity.py tests/test_validation_evaluator_parity.py tests/test_candle_repair.py

      - name: Build source-pinned Windows paper package
        run: python -m scripts.build_pc_paper_package --output-dir "${{ runner.temp }}/paper-package"
      - name: Upload Windows paper package
        uses: actions/upload-artifact@v4
        with:
          name: pc-paper-package
          path: ${{ runner.temp }}/paper-package/
          if-no-files-found: error
