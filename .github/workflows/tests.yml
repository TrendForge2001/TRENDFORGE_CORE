name: TrendForge Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile source
        env:
          PYTHONPATH: .
        run: python -m compileall -q api core database engines providers scanner services start.py

      - name: Import production app
        env:
          PYTHONPATH: .
        run: python -c "from start import app; print(app.title)"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore


  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up production Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependency ranges
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify production dependency consistency
        run: python -m pip check

      - name: Capture resolved production dependency graph
        run: |
          python -m pip freeze --all | sort | tee production-freeze.txt
          python - <<'PY'
          import platform
          print("PYTHON_RUNTIME=" + platform.python_version())
          PY

      - name: Upload production dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: production-freeze-py312
          path: production-freeze.txt
          if-no-files-found: error
